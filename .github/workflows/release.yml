name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install
      - name: Prepare icon
        run: node scripts/ensure-icon.mjs
      - name: Build & publish (installer + auto-update metadata)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish clean release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release edit "${{ github.ref_name }}" --draft=false --title "Nyx ${{ github.ref_name }}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

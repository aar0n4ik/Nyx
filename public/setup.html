<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Установка Nyx</title>
<style>
*{box-sizing:border-box}
:root{
 --bg:#0b0b0f;--panel:#111119;--cell:#0e0e15;--ink:#f2f2f5;--muted:#9a9aa6;--line:#1c1c24;
 --accent:#7c5cff;--accent-2:#9d86ff;--accent-soft:#191426;--ok:#19e3b1;--warn:#febc2e;--bad:#ff6b6b;--radius:18px;
}
html,body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:760px;margin:0 auto;padding:26px 22px 44px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}
.brand .mark{width:32px;height:32px;display:block;border-radius:9px}
.brand .word{font-weight:800;font-size:20px;letter-spacing:-.02em}
h1{font-size:27px;letter-spacing:-.03em;margin:0 0 6px}
.sub{color:var(--muted);font-size:15px;margin:0 0 26px;line-height:1.5}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 20px;margin-bottom:16px}
.phead{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:14px}
.hwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hwcell{background:var(--cell);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.hwcell .k{font-size:11px;color:var(--muted);margin-bottom:3px}
.hwcell .v{font-size:14px;font-weight:600;word-break:break-word}
.mcard{display:block;position:relative;background:var(--cell);border:1px solid var(--line);border-radius:15px;
 padding:15px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s}
.mcard:hover{border-color:#2c2c3a}
.mcard.sel{border-color:var(--accent);background:var(--accent-soft)}
.mcard.off{opacity:.45;cursor:not-allowed}
.mcard input{position:absolute;opacity:0;pointer-events:none}
.mbadge{display:inline-block;margin-bottom:11px;font-size:11px;font-weight:700;color:var(--accent-2);
 background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.32);padding:4px 11px;border-radius:20px}
.mtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mname{font-size:16px;font-weight:700;letter-spacing:-.01em}
.msize{font-size:14px;font-weight:700;color:var(--accent-2);white-space:nowrap}
.mmeta{margin-top:5px;font-size:13px;color:var(--muted);line-height:1.45}
.mwarn{color:var(--warn)}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:11px;
 padding:10px 15px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.ghost:hover{border-color:var(--accent);color:var(--accent-2)}
#toggleOthers{margin-top:2px}
#others{margin-top:14px}
.hidden{display:none}
.loc{display:flex;gap:8px;flex-wrap:wrap}
.loc input{flex:1;min-width:200px;background:var(--cell);border:1px solid var(--line);border-radius:11px;
 padding:11px 13px;color:var(--ink);font:inherit;font-size:14px;outline:none}
.loc input:focus{border-color:var(--accent)}
.hint{margin-top:11px;font-size:12.5px;color:var(--muted);line-height:1.45}
.err{background:#241214;border:1px solid #4a1f22;color:#ffb0b0;border-radius:13px;padding:14px 16px;
 font-size:13.5px;line-height:1.55;margin-bottom:16px;white-space:pre-line}
.prog{margin-bottom:18px}
.pbar{height:10px;background:var(--cell);border:1px solid var(--line);border-radius:20px;overflow:hidden}
#pfill{height:100%;width:0;background:var(--accent);border-radius:20px;transition:width .4s ease}
.pmeta{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:12.5px;color:var(--muted)}
.cta{display:flex;gap:10px;margin-top:6px}
.primary{background:var(--accent);color:#fff;border:0;border-radius:13px;padding:14px 24px;
 font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.primary:hover{background:var(--accent-2)}
.primary:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="app">
  <div class="brand"><img src="/logo.svg" alt="Nyx" class="mark"><span class="word">Nyx</span></div>
  <h1>Установка Nyx</h1>
  <p class="sub">Локальный ИИ на вашем компьютере. Всё работает офлайн, ничего не уходит в облако.</p>

  <section class="panel">
    <div class="phead">Ваш компьютер</div>
    <div id="hw" class="hwgrid"></div>
  </section>

  <section class="panel">
    <div class="phead">Выберите модель</div>
    <div id="rec"></div>
    <button id="toggleOthers" class="ghost" type="button">Показать другие модели</button>
    <div id="others" class="hidden"></div>
  </section>

  <section class="panel">
    <div class="phead">Папка для модели</div>
    <div class="loc">
      <input id="locInput" type="text" spellcheck="false" placeholder="C:\Models\Nyx">
      <button id="browse" class="ghost" type="button">Обзор</button>
      <button id="saveLoc" class="ghost" type="button">Сохранить</button>
    </div>
    <div id="locHint" class="hint"></div>
  </section>

  <div id="err" class="err hidden"></div>

  <div id="progWrap" class="prog hidden">
    <div class="pbar"><div id="pfill"></div></div>
    <div class="pmeta"><span id="pnote"></span><span id="ppct"></span></div>
  </div>

  <div class="cta">
    <button id="install" class="primary" disabled>Скачать и установить</button>
    <button id="open" class="primary hidden">Открыть Nyx</button>
  </div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)}
  var statusData=null, selectedKey=null, poll=null;

  function api(path, method, body){
    return fetch(path,{method:method||"GET",headers:body?{"content-type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json()}).catch(function(){return null})
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]})}
  function fmt(b){b=Number(b)||0;if(b>=1e9)return (b/1e9).toFixed(2)+" GB";if(b>=1e6)return Math.round(b/1e6)+" MB";if(b>=1e3)return Math.round(b/1e3)+" KB";return b+" B"}
  function sizeOf(gb){return (Number(gb)||0).toFixed(2)+" GB"}
  function ram(){return statusData&&statusData.hardware?Number(statusData.hardware.ramGB)||0:0}

  function renderHW(hw){
    hw=hw||{};
    var gpu=Array.isArray(hw.gpu)?hw.gpu.filter(Boolean).join(", "):(hw.gpu||"");
    var cells=[["Процессор",hw.cpu||"—"],["Ядра",hw.cores?String(hw.cores):"—"],["Память",hw.ramGB?hw.ramGB+" GB":"—"],["Видеокарта",gpu||"—"],["Система",hw.os||hw.platform||"—"]];
    $("#hw").innerHTML=cells.map(function(c){return '<div class="hwcell"><div class="k">'+esc(c[0])+'</div><div class="v">'+esc(c[1])+'</div></div>'}).join("");
  }

  function cardHTML(m, recommended){
    var off=m.available===false;
    var sel=m.key===selectedKey;
    var lowRam=m.ramMinGB && ram() && m.ramMinGB>ram();
    var badge=recommended?'<div class="mbadge">Рекомендуется для вашего ПК</div>':'';
    var meta=(m.ramMinGB?("Нужно "+m.ramMinGB+" GB ОЗУ · "):"")+esc(m.note||"");
    /* убрали ложную пометку «недоступно»: модель докачивается движком при установке */
    var warn=lowRam?'<div class="mmeta mwarn">Может не хватить оперативной памяти на вашем ПК</div>':'';
    return '<label class="mcard'+(sel?' sel':'')+(off?' off':'')+'" data-key="'+esc(m.key)+'">'
      +badge
      +'<input type="radio" name="model" value="'+esc(m.key)+'"'+(sel?' checked':'')+(off?' disabled':'')+'>'
      +'<div class="mtop"><span class="mname">'+esc(m.label)+'</span><span class="msize">'+sizeOf(m.approxGB)+'</span></div>'
      +'<div class="mmeta">'+meta+'</div>'+warn
      +'</label>';
  }

  function renderModels(){
    var rec=statusData.recommended||{};
    var cat=statusData.catalog||[];
    var recEntry=null, others=[];
    cat.forEach(function(m){ if(m.key===rec.key) recEntry=m; else others.push(m); });
    if(!recEntry && rec.key) recEntry={key:rec.key,label:rec.label,approxGB:rec.approxGB,note:rec.note,ramMinGB:rec.ramMinGB,available:true};
    $("#rec").innerHTML=recEntry?cardHTML(recEntry,true):"";
    $("#others").innerHTML=others.map(function(m){return cardHTML(m,false)}).join("");
    bindCards();
  }

  function bindCards(){
    Array.prototype.forEach.call(document.querySelectorAll(".mcard"),function(el){
      el.addEventListener("click",function(){
        if(el.classList.contains("off")) return;
        selectedKey=el.getAttribute("data-key");
        Array.prototype.forEach.call(document.querySelectorAll(".mcard"),function(c){c.classList.toggle("sel",c.getAttribute("data-key")===selectedKey)});
        var r=el.querySelector("input"); if(r) r.checked=true;
        updateBtn();
      });
    });
  }

  function updateBtn(){
    var dl=statusData&&statusData.download&&statusData.download.phase==="downloading";
    $("#install").disabled=!(statusData&&selectedKey&&!dl);
  }
  function showErr(msg){var e=$("#err");if(!msg){e.classList.add("hidden");e.textContent="";return}e.classList.remove("hidden");e.textContent=msg}
  function showProg(d){
    $("#progWrap").classList.remove("hidden");
    var pct=Math.max(0,Math.min(100,Number(d.pct)||0));
    $("#pfill").style.width=pct+"%";
    $("#pnote").textContent=d.note||"Загрузка модели на ваш компьютер";
    var meta=(d.targetBytes>0)?(fmt(d.bytes)+" / "+fmt(d.targetBytes)+" · "+pct+"%"):(pct+"%");
    $("#ppct").textContent=meta;
  }
  function done(){$("#install").classList.add("hidden");$("#open").classList.remove("hidden");$("#pnote").textContent="Готово";$("#pfill").style.width="100%"}

  function startPoll(){
    if(poll) clearInterval(poll);
    poll=setInterval(function(){
      api("/api/setup/progress").then(function(d){
        if(!d) return;
        if(d.phase==="downloading"){showProg(d)}
        else if(d.phase==="ready"){showProg({pct:100,bytes:d.bytes,targetBytes:d.targetBytes,note:"Готово"});clearInterval(poll);poll=null;done()}
        else if(d.phase==="error"){clearInterval(poll);poll=null;showErr(d.error||"Не удалось загрузить модель");$("#install").disabled=false}
      });
    },1200);
  }

  function renderLoc(loc){
    loc=loc||{};
    $("#locInput").value=loc.cacheDir||loc.default||"";
    $("#locHint").textContent=loc.custom?"Модель будет сохранена в выбранную папку.":"По умолчанию модель сохраняется в вашей пользовательской папке. Можно выбрать другую.";
  }

  function saveLoc(){
    var p=$("#locInput").value.trim();
    if(!p){$("#locHint").textContent="Укажите путь к папке.";return}
    api("/api/setup/location","POST",{path:p}).then(function(r){
      if(r&&r.ok){$("#locHint").textContent="Папка сохранена: "+r.cacheDir}
      else{$("#locHint").textContent="Не удалось сохранить: "+((r&&r.error)||"ошибка")}
    });
  }

  function hwSkeleton(){
    var cells=["Процессор","Ядра","Память","Видеокарта","Система"];
    $("#hw").innerHTML=cells.map(function(k){return '<div class="hwcell"><div class="k">'+k+'</div><div class="v" style="opacity:.5">определяем…</div></div>'}).join("");
    $("#rec").innerHTML='<div class="mcard" style="opacity:.6;cursor:default"><div class="mmeta">Подбираем лучшую модель для вашего ПК…</div></div>';
    var b=$("#install"); if(b){ b.textContent="Определяем ваш ПК…"; b.disabled=true; }
  }
  function load(){
    hwSkeleton();
    api("/api/setup/status").then(function(d){
      if(!d){showErr("Не удалось получить статус установки. Перезапустите Nyx.");var eb=$("#install");if(eb)eb.textContent="Скачать и установить";return}
      statusData=d;
      renderHW(d.hardware);
      if(d.hwDetailed===false){
        var note=document.createElement("div"); note.id="hwnote"; note.className="hint"; note.textContent="Уточняем полные характеристики…";
        var hwEl=$("#hw"); if(hwEl&&hwEl.parentNode) hwEl.parentNode.appendChild(note);
        api("/api/setup/hardware").then(function(h){ if(h){ statusData.hardware=h; renderHW(h); } var n=document.getElementById("hwnote"); if(n) n.remove(); }).catch(function(){ var n=document.getElementById("hwnote"); if(n) n.remove(); });
      }
      if(d.recommended&&d.recommended.key) selectedKey=d.recommended.key;
      renderModels();
      renderLoc(d.location);
      var ib=$("#install"); if(ib) ib.textContent="Скачать и установить";
      if(d.ready){
        $("#install").classList.add("hidden");
        $("#open").classList.remove("hidden");
        $("#progWrap").classList.remove("hidden");
        showProg({pct:100,bytes:d.download&&d.download.bytes,targetBytes:d.download&&d.download.targetBytes,note:"Модель уже установлена"});
      } else if(d.download&&d.download.phase==="downloading"){
        showProg(d.download); startPoll();
      } else if(d.download&&d.download.phase==="error"){
        showErr(d.download.error);
      }
      updateBtn();
    });
  }

  $("#toggleOthers").addEventListener("click",function(){
    var o=$("#others");var hidden=o.classList.toggle("hidden");
    this.textContent=hidden?"Показать другие модели":"Скрыть другие модели";
  });
  $("#install").addEventListener("click",function(){
    if(!selectedKey) return;
    showErr("");$("#install").disabled=true;
    $("#progWrap").classList.remove("hidden");
    showProg({pct:0,bytes:0,targetBytes:0,note:"Подготовка загрузки..."});
    api("/api/setup/download","POST",{model:selectedKey}).then(function(d){
      if(!d){showErr("Не удалось запустить загрузку.");$("#install").disabled=false;return}
      if(d.error&&d.phase==="error"){showErr(d.error);$("#install").disabled=false;return}
      showProg(d); startPoll();
    });
  });
  $("#browse").addEventListener("click",function(){
    api("/api/setup/browse","POST",{}).then(function(r){
      if(!r||r.electron===false){$("#locHint").textContent="Обзор папок доступен только в приложении. Впишите путь вручную.";return}
      if(r.canceled) return;
      if(r.path){$("#locInput").value=r.path; saveLoc();}
    });
  });
  $("#saveLoc").addEventListener("click",saveLoc);
  $("#open").addEventListener("click",function(){location.href="/app"});

  load();
})();
</script>
</body>
</html>
